<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pamimo, Forgive Me?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      transition: background 1s;
    }
    .container {
      background: rgba(255,255,255,0.93);
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 2.7em 2em 2.4em 2em;
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
      transition: background 1s;
    }
    .heart {
      font-size: 2.2em;
      animation: heartbeat 1.7s infinite;
      color: #ff5e62;
      margin-bottom: 12px;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1);}
      10%, 30% { transform: scale(1.18);}
      20%, 40% { transform: scale(0.92);}
      50% { transform: scale(1);}
    }
    h2 {
      color: #ff5e62;
      margin-bottom: 0.4em;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }
    p {
      color: #665544;
      font-size: 1.17em;
      margin-bottom: 2em;
      line-height: 1.7;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 1.7em;
      margin-bottom: 1.8em;
      position: relative;
      min-height: 65px;
    }
    button {
      padding: 0.8em 2.1em;
      border: none;
      border-radius: 12px;
      font-size: 1.12em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.08s;
      position: relative;
      z-index: 1;
      box-shadow: 0 2px 8px #fceabb88;
      font-family: inherit;
    }
    .yes {
      background: linear-gradient(90deg, #ff9966, #ff5e62);
      color: #fff;
      font-weight: bold;
    }
    .yes:hover:enabled {
      background: linear-gradient(90deg, #ff5e62, #ff9966);
      transform: scale(1.08) rotate(-2deg);
    }
    .no {
      background: #f8b500;
      color: #fff;
      font-weight: bold;
      position: absolute;
      left: 180px;
      top: 0;
      z-index: 3;
    }
    #response {
      font-size: 1.16em;
      color: #ff5e62;
      margin-top: 1.1em;
      font-weight: bold;
      min-height: 1.5em;
      letter-spacing: 0.02em;
    }
    .cat-gif {
      width: 220px;
      height: auto;
      border-radius: 16px;
      margin: 1em 0 0.5em 0;
      box-shadow: 0 4px 18px #fceabbaa;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .wink-kiss {
      font-size: 2.4em;
      display: inline-block;
      opacity: 0;
      transition: opacity 0.2s;
      margin-left: 0.3em;
    }
    .show {
      opacity: 1;
      animation: wink 0.6s, kiss 1.3s 0.6s;
    }
    @keyframes wink {
      0%   { transform: scale(1) rotate(0deg);}
      45%  { transform: scale(1.18) rotate(-10deg);}
      55%  { transform: scale(1.18) rotate(-10deg);}
      100% { transform: scale(1) rotate(0deg);}
    }
    @keyframes kiss {
      0%   { color: #ff5e62; }
      100% { color: #f8b500; }
    }
  </style>
</head>
<body>
  <div class="container" id="main-container">
    <div class="heart">❤️</div>
    <h2>Pamimo,</h2>
    <p>
      I'm sorry for making you feel uncomfortable.<br>
      Will you forgive me? 🥺
    </p>
    <div class="buttons" id="btns">
      <button class="yes" onclick="forgiveMe()">Yes</button>
      <button class="no" id="noBtn">No</button>
    </div>
    <div id="response"></div>
  </div>
  <script>
    // "No" button escapes infinitely
    const noBtn = document.getElementById('noBtn');
    const buttonsDiv = document.querySelector('.buttons');
    noBtn.addEventListener('mouseenter', moveNoBtn);
    noBtn.addEventListener('mousedown', moveNoBtn);
    function moveNoBtn() {
      const btn = noBtn;
      const parent = buttonsDiv;
      let maxX = parent.offsetWidth - btn.offsetWidth;
      let maxY = parent.offsetHeight - btn.offsetHeight;
      let randX = Math.random() * maxX;
      let randY = Math.random() * maxY;
      if (randX < 90) randX += 85;
      btn.style.left = randX + "px";
      btn.style.top = randY + "px";
    }

    // "Yes" button: show new message, cat gif, and wink-then-kiss
    function forgiveMe() {
      document.body.style.background = "linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)";
      const container = document.getElementById('main-container');
      container.innerHTML = `
        <div class="heart">❤️</div>
        <h2>I knew you would forgive <span class="wink-kiss" id="winkKiss">😉</span><span class="wink-kiss" id="kiss" style="margin-left:0.1em;">😘</span></h2>
        <img class="cat-gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="Cute Cat">
        <div id="response" style="color:#f8b500; font-size:1.3em; margin-top:1em;">❤️</div>
      `;

      // Wink then Kiss animation
      setTimeout(() => {
        document.getElementById('winkKiss').classList.add('show');
        setTimeout(() => {
          document.getElementById('winkKiss').classList.remove('show');
          document.getElementById('kiss').classList.add('show');
        }, 700);
      }, 600);
    }
  </script>
</body>
</html>
