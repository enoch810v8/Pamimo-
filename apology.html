<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Forgive Me? 💌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
    }
    .container {
      background: rgba(255,255,255,0.93);
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 2.7em 2em 2.4em 2em;
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    .heart {
      font-size: 2.2em;
      animation: heartbeat 1.7s infinite;
      color: #ff5e62;
      margin-bottom: 12px;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1);}
      10%, 30% { transform: scale(1.18);}
      20%, 40% { transform: scale(0.92);}
      50% { transform: scale(1);}
    }
    h2 {
      color: #ff5e62;
      margin-bottom: 0.4em;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }
    p {
      color: #665544;
      font-size: 1.17em;
      margin-bottom: 2em;
      line-height: 1.7;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 1.7em;
      margin-bottom: 1.8em;
      position: relative;
      min-height: 65px;
    }
    button {
      padding: 0.8em 2.1em;
      border: none;
      border-radius: 12px;
      font-size: 1.12em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.08s;
      position: relative;
      z-index: 1;
      box-shadow: 0 2px 8px #fceabb88;
      font-family: inherit;
    }
    .yes {
      background: linear-gradient(90deg, #ff9966, #ff5e62);
      color: #fff;
      font-weight: bold;
    }
    .yes:hover:enabled {
      background: linear-gradient(90deg, #ff5e62, #ff9966);
      transform: scale(1.08) rotate(-2deg);
    }
    .no {
      background: #f8b500;
      color: #fff;
      font-weight: bold;
      position: absolute;
      left: 180px; /* initial position */
      top: 0;
      z-index: 3;
    }
    #response {
      font-size: 1.16em;
      color: #ff5e62;
      margin-top: 1.1em;
      font-weight: bold;
      min-height: 1.5em;
      letter-spacing: 0.02em;
    }
    .sparkle {
      position: absolute;
      width: 28px;
      height: 28px;
      top: -22px;
      right: 22px;
      font-size: 1.3em;
      color: #f8b500;
      animation: twinkle 1.6s infinite alternate;
      pointer-events: none;
    }
    @keyframes twinkle {
      from { opacity: 0.4; transform: rotate(0deg);}
      to { opacity: 1; transform: rotate(25deg);}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sparkle">✨</div>
    <div class="heart">❤️</div>
    <h2>My Sweetheart,</h2>
    <p>
      I’m so sorry for hurting you.<br>
      I miss your smile, your laugh, your warmth.<br>
      My world just isn’t the same without you.<br>
      Will you forgive me, and let me hold you close again? 🌹
    </p>
    <div class="buttons">
      <button class="yes" onclick="forgiveMe()">Yes, I forgive you 💖</button>
      <button class="no" id="noBtn">No</button>
    </div>
    <div id="response"></div>
  </div>
  <script>
    // The "No" button will avoid the user's mouse!
    const noBtn = document.getElementById('noBtn');
    const buttonsDiv = document.querySelector('.buttons');
    noBtn.addEventListener('mouseenter', moveNoBtn);
    noBtn.addEventListener('mousedown', moveNoBtn);
    let moveCount = 0;
    function moveNoBtn() {
      const btn = noBtn;
      const parent = buttonsDiv;
      const parentRect = parent.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      // Parent relative positions
      let maxX = parent.offsetWidth - btn.offsetWidth;
      let maxY = parent.offsetHeight - btn.offsetHeight;
      let randX = Math.random() * maxX;
      let randY = Math.random() * maxY;
      // Prevent from jumping too close to the Yes button
      if (randX < 90) randX += 85;
      btn.style.left = randX + "px";
      btn.style.top = randY + "px";
      moveCount++;
      if (moveCount > 5) {
        btn.textContent = "You know you want to say Yes! 😘";
      }
    }
    function forgiveMe() {
      document.getElementById('response').textContent = "Yaaay! Thank you, my love! I promise to make you smile always 💑✨";
      document.querySelector('.yes').disabled = true;
      noBtn.style.display = 'none';
      document.querySelector('.heart').textContent = '💞';
    }
  </script>
</body>
</html>
